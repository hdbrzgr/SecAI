<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>
  .ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .ds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5); }
  .ds-flush { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .ds-flush > :last-child { border-bottom: 0; }
  #root { padding: var(--space-4); }
</style>
</head>
<body class="sx-root">
<div id="root"></div>
<script>
  var S = window.SecAI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'ds-stack'},
      h('div',{className:'ds-row'},
        h(S.Button,{variant:'primary',icon:'scan-search'},'Run scan'),
        h(S.Button,null,'View report'),
        h(S.Button,{variant:'ghost',icon:'copy'},'Copy'),
        h(S.Button,{variant:'danger'},'Delete website')),
      h('div',{className:'ds-row'},
        h(S.Button,{variant:'primary',size:'lg'},'Create account'),
        h(S.Button,{variant:'primary',loading:true},'Checking'),
        h(S.Button,{size:'sm',icon:'refresh-cw'},'Re-run'),
        h(S.Button,{disabled:true},'Disabled')))
  );
</script>
</body>
</html>
