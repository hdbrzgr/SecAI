<!-- @dsCard group="Forms" height=200 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField</title>
<style>
  .ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .ds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5); }
  .ds-flush { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .ds-flush > :last-child { border-bottom: 0; }
  #root { padding: var(--space-4); }
</style>
</head>
<body class="sx-root">
<div id="root"></div>
<script>
  var S = window.SecAI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'ds-grid'},
      h(S.TextField,{label:'Website URL',mono:true,placeholder:'https://example.com',hint:'The homepage of a site you own.'}),
      h(S.TextField,{label:'Password',type:'password',defaultValue:'short',error:'Use at least 12 characters.'}))
  );
</script>
</body>
</html>
