<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title>
<style>
  .ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .ds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5); }
  .ds-flush { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .ds-flush > :last-child { border-bottom: 0; }
  #root { padding: var(--space-4); }
</style>
</head>
<body class="sx-root">
<div id="root"></div>
<script>
  var S = window.SecAI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'ds-row',style:{color:'var(--ink-muted)'}},
      ['shield-check','scan-search','bug','globe','folder-git-2','file-code','lock','clock','copy','refresh-cw','triangle-alert','circle-check'].map(function(n){return h(S.Icon,{key:n,name:n,size:24,label:n})}))
  );
</script>
</body>
</html>
