<!-- @dsCard group="Security" height=300 width=920 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>FindingRow</title>
<style>
  .ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .ds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5); }
  .ds-flush { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .ds-flush > :last-child { border-bottom: 0; }
  #root { padding: var(--space-4); }
</style>
</head>
<body class="sx-root">
<div id="root"></div>
<script>
  var S = window.SecAI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'ds-flush'},
      h(S.FindingRow,{severity:'critical',title:'SQL injection in the search parameter',location:'https://example.com/search?q=',cwe:'CWE-89',tool:'ZAP',href:'#'}),
      h(S.FindingRow,{severity:'high',title:'AWS access key committed to the repository',location:'config/settings.py:12',cwe:'CWE-798',tool:'Gitleaks',href:'#'}),
      h(S.FindingRow,{severity:'medium',title:'Missing Content-Security-Policy header',location:'https://example.com/',cwe:'CWE-693',tool:'Headers',href:'#'}),
      h(S.FindingRow,{severity:'low',title:'Cookie without the Secure flag',location:'Set-Cookie: session_hint',cwe:'CWE-614',tool:'ZAP',status:'fixed',href:'#'}))
  );
</script>
</body>
</html>
