  .brand-deep { fill: var(--signal-strong); }
  .night { fill: var(--night); }

  .pip { fill: var(--sev-critical); rx: var(--radius-xs); }
  .blk { rx: var(--radius-md); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .name span { color: var(--signal); }
