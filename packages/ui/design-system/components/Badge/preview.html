<!-- @dsCard group="Status" height=70 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge</title>
<style>
  .ds-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .ds-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-5); }
  .ds-flush { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .ds-flush > :last-child { border-bottom: 0; }
  #root { padding: var(--space-4); }
</style>
</head>
<body class="sx-root">
<div id="root"></div>
<script>
  var S = window.SecAI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'ds-row'},
      h(S.Badge,{tone:'signal',icon:'shield-check'},'Verified'),
      h(S.Badge,{tone:'signal',icon:'check'},'Fixed'),
      h(S.Badge,{icon:'clock'},'Not verified'),
      h(S.Badge,{tone:'warning',icon:'triangle-alert'},'Expires in 3 days'),
      h(S.Badge,{tone:'danger',icon:'circle-x'},'Failed'),
      h(S.Badge,null,'Accepted risk'))
  );
</script>
</body>
</html>
