name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secai
          POSTGRES_PASSWORD: secai
          POSTGRES_DB: secai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECAI_DATABASE_URL: postgresql+asyncpg://secai:secai@localhost:5432/secai
      SECAI_TEST_DATABASE_URL: postgresql+asyncpg://secai:secai@localhost:5432/secai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secai-api apps/api
      - run: docker build -t secai-web apps/web
