name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secai
          POSTGRES_PASSWORD: secai
          POSTGRES_DB: secai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECAI_DATABASE_URL: postgresql+asyncpg://secai:secai@localhost:5432/secai
      SECAI_TEST_DATABASE_URL: postgresql+asyncpg://secai:secai@localhost:5432/secai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design system contrast check
        run: npm run check -w @secai/ui
      - name: Design system build (generated files must be committed)
        run: npm run build -w @secai/ui && git diff --exit-code -- packages/ui/src
      - run: npm run lint -w secai-web
      - run: npm run typecheck -w secai-web
      - run: npm run build -w secai-web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t secai-api apps/api
      - run: docker build --target worker -t secai-worker apps/api
      - run: docker build -t secai-web -f apps/web/Dockerfile .
