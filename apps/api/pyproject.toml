[project]
name = "secai-api"
version = "0.1.0"
description = "SecAI backend API and scan workers"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "argon2-cffi",
    "cryptography",
    "pyotp",
    "redis>=5",
    "arq",
    "dnspython>=2.8.0",
    "httpx>=0.28.1",
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "aiosqlite",
    "fakeredis",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
# Scanners carry long human-readable finding text, and deliberately treat
# unreachable paths as "no finding".
"app/scanning/scanners/**" = ["E501", "S110", "S112"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
